name: Changeset status

# A reminder, not a required check: warns when a pull request changes library
# code without a changeset. It runs the pull request's own code, which is safe
# because the job holds `contents: read` only and a fork's run gets no secrets.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'ios/**'
      - 'android/**'
      - 'cpp/**'
      - 'nitrogen/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  status:
    name: Changeset present
    runs-on: ubuntu-latest

    # The Version Packages pull request deletes changesets; it is never missing one.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `--since=origin/main` needs the base branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check for a changeset
        run: |
          if ! bun run changeset status --since=origin/main; then
            echo "::warning title=Missing changeset::No changeset in .changeset/ describes the library code this pull request changes, so merging it will not release anything. Add one with \`bun run changeset\`, or an empty one with \`bun run changeset add --empty\` when it really should not release."
          fi
