name: CI

# Read-only token: nothing here writes to the repository, so a compromised
# dependency in a checked-out script cannot either.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  # One group per commit on `main`: GitHub keeps a single pending run per group and
  # replaces it when another is queued, even with `cancel-in-progress: false`.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `check` has not been tried on a shallow clone.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      # Both unit-test runners are steps of `check`: Jest (`test:library`) and Vitest
      # (`test:tooling`).
      - name: Run all checks
        run: bun run check

  # The C++ and Swift host tests, which `check` skips on Linux because they need
  # clang and swiftc.
  native-tests:
    name: Native tests (host, ASan)
    # Pinned rather than `macos-latest`, so the toolchain cannot change under a
    # green run.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The scroll-offset test compiles against react-native-nitro-modules'
      # headers (Null.hpp), so the dependencies must be installed.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Run host native tests
        run: bash scripts/native-tests.sh

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6's default cache provider is a proprietary GitHub service; basic
          # caching works on public and self-hosted runners alike.
          cache-provider: basic
          cache-read-only: false

      # `build-app.mjs` rather than a raw `assembleDebug`: it also checks that every
      # registered component is in the dex.
      - name: Build stamped debug app
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'
          # A hosted runner's ccache starts empty, where a launcher is pure overhead.
          NITRO_UI_CCACHE: '0'
        run: node scripts/build-app.mjs --platform android --arch x86_64

      # Runs here because this job already has the Android toolchain and a warm
      # Gradle cache. `NITRO_UI_ANDROID_JVM_TESTS=1` opts in: the script skips when
      # `CI` is set, and Actions sets it on every step.
      - name: Android JVM unit tests
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'
          NITRO_UI_ANDROID_JVM_TESTS: '1'
        run: bash scripts/native-tests-android.sh

  # A release build catches codegen/dex/R8 problems that a debug build tolerates.
  build-android-release:
    name: Build Android (release)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6's default cache provider is a proprietary GitHub service; basic
          # caching works on public and self-hosted runners alike.
          cache-provider: basic
          cache-read-only: false

      # All four ABIs on purpose: this is the one job that catches an
      # armeabi-v7a/x86 compile break in cpp/.
      - name: Assemble release APK
        working-directory: example/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'
          # A hosted runner's ccache starts empty, where a launcher is pure overhead.
          NITRO_UI_CCACHE: '0'
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

  # Opt-in: it needs KVM, and an emulator on a hosted runner is slower and less
  # reproducible than a local one.
  harness-android:
    name: Harness (Android)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Build ~10 min, the harness's 900 s boot budget, a suite that takes ~9 min on a
    # quiet machine and several times that here, 5 for diagnostics, and an upload.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: false

      # `build-app.mjs` writes `example/android/app.stamp`, and the harness config
      # refuses an APK whose stamp does not match this tree.
      - name: Build stamped debug app
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'
          # A hosted runner's ccache starts empty, where a launcher is pure overhead.
          NITRO_UI_CCACHE: '0'
        run: node scripts/build-app.mjs --platform android --arch x86_64

      # Printed before the run because the harness does not log which GPU mode,
      # cores or AVD it used. The AVD's own `config.ini` is not read here: the AVD
      # does not exist until the harness step creates or restores it.
      - name: Show the emulator configuration this job will boot
        run: |
          # `-accel-check` touches /dev/kvm and can block forever. Not `timeout(1)`:
          # it is not installed on macOS, where this body may also be run.
          bounded() {
            local secs=$1; shift
            "$@" &
            local pid=$!
            local waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge "$secs" ]; then
                echo "bounded: $* gave no answer in ${secs}s" >&2
                kill -KILL "$pid" 2>/dev/null || true
                break
              fi
              sleep 1
              waited=$((waited + 1))
            done
            # Reap it, and keep `-e` from taking the kill's exit status as the step's.
            wait "$pid" 2>/dev/null || true
          }
          ACCEL_TIMEOUT="${NITRO_UI_CI_ACCEL_TIMEOUT:-30}"
          AVD_NAME="$(node scripts/ci-avd-name.mjs)"
          echo "avd (from rn-harness.config.mjs): $AVD_NAME"
          echo "nproc: $(nproc)  mem: $(free -g | awk '/^Mem:/{print $2}')GiB  load: $(cut -d' ' -f1-3 /proc/loadavg)"
          echo "kvm: $(ls -l /dev/kvm 2>&1)"
          bounded "$ACCEL_TIMEOUT" "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | sed 's/^/accel: /'
          echo "--- AVD dir (empty before the run is normal: the harness creates it next step) ---"
          ls -la "$HOME/.android/avd" 2>&1 | sed 's/^/  /'
          echo "--- the GPU mode this repo's rule chooses on this machine ---"
          node -e "import('./scripts/emulator-launch.mjs').then((m)=>{console.log('gpu mode:', m.emulatorGpuModeForHost({env: process.env, platform: process.platform})); console.log('DISPLAY:', JSON.stringify(process.env.DISPLAY ?? null), 'WAYLAND_DISPLAY:', JSON.stringify(process.env.WAYLAND_DISPLAY ?? null));})"

      - name: Run Harness tests
        uses: callstackincubator/react-native-harness@3e3e25b8ddfd0018fbc0700e0932448ffe5a95db # v1.6.0
        with:
          runner: android
          projectRoot: example
          packageManager: bun
          # Absolute: the action exports this as `HARNESS_APP_PATH` and the Android
          # platform checks it with `existsSync` from `projectRoot`. A relative path
          # is never found, and the run dies as an opaque `AbortError`.
          app: ${{ github.workspace }}/example/android/app/build/outputs/apk/debug/app-debug.apk
          preRunHook: 'echo "pre-run: booting at $(date -u +%H:%M:%S) load=$(cut -d" " -f1 /proc/loadavg)"'
          afterRunHook: |
            echo "after-run: harness exited ${HARNESS_EXIT_CODE:-?} at $(date -u +%H:%M:%S) load=$(cut -d' ' -f1 /proc/loadavg)"
            pgrep -a qemu || echo 'after-run: no qemu process'

      # A script rather than shell so that it always exits 0 and bounds every command
      # it runs: this step must neither fail nor hang, or it hides the failure it is
      # there to explain.
      - name: Collect emulator boot diagnostics
        if: always()
        # A backstop for a runner that stops responding; the script gives up on its
        # own budget first.
        timeout-minutes: 5
        run: node scripts/ci-emulator-diagnostics.mjs --out harness-diag

      - name: Upload emulator boot diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-boot-diagnostics-android
          # Not a dot-directory: upload-artifact v4 skips hidden files unless
          # `include-hidden-files` is set.
          path: harness-diag
          # The collect step writes `host.log` first, so no files means it never ran.
          if-no-files-found: error

  # Opt-in like the harness: the full suite on an emulator nothing else shares, so its
  # run time and pass rate here can be compared with a leased local run.
  real-input-android:
    name: Real input (Android) ${{ matrix.attempt }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Trial only: three independent runs of one tree, for the pass rate.
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    # Build ~10 min, emulator boot, a suite that takes ~40 min locally, and an upload.
    timeout-minutes: 120
    env:
      # The runner refuses to pick a device itself; this VM has exactly this one.
      ANDROID_AVD: nitroui
      EMULATOR_PORT: '5554'
      ANDROID_SERIAL: emulator-5554
      METRO_PORT: '8081'
      # Pinned: newer command-line tools put AVDs under an XDG folder otherwise.
      ANDROID_AVD_HOME: /home/runner/.android/avd

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Build stamped debug app
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'
          NITRO_UI_CCACHE: '0'
        run: node scripts/build-app.mjs --platform android --arch x86_64

      # The same device the leased local emulators are: API 35, Google APIs, a Pixel 9
      # profile with no hardware keyboard, so the soft keyboard the suite reads comes up.
      - name: Create the emulator
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          image='system-images;android-35;google_apis;x86_64'
          yes | "$sdk/sdkmanager" "$image" emulator platform-tools > /dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo no | "$sdk/avdmanager" create avd -n "$ANDROID_AVD" -k "$image" -d pixel_9 --force
          cfg="$ANDROID_AVD_HOME/$ANDROID_AVD.avd/config.ini"
          ls -la "$ANDROID_AVD_HOME"
          printf 'hw.ramSize=4096\nhw.cpu.ncore=4\ndisk.dataPartition.size=6G\nhw.keyboard=no\nhw.initialOrientation=portrait\n' >> "$cfg"

      - name: Boot the emulator
        run: |
          echo "nproc: $(nproc)  mem: $(free -g | awk '/^Mem:/{print $2}')GiB  load: $(cut -d' ' -f1-3 /proc/loadavg)"
          launch=$(node -e "import('./scripts/emulator-launch.mjs').then((m) => console.log(m.emulatorLaunchCommand({ avd: process.env.ANDROID_AVD, port: Number(process.env.EMULATOR_PORT), snapshot: 'cold', host: { env: process.env, platform: process.platform } }, process.env.ANDROID_HOME + '/emulator/emulator')))")
          echo "launch: $launch"
          # Outside the checkout: a new file there changes the tree the app stamp was built from.
          nohup $launch > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb -s "$ANDROID_SERIAL" wait-for-device
          booted=''
          for _ in $(seq 1 300); do
            booted=$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$booted" = 1 ] && break
            sleep 2
          done
          echo "boot_completed=$booted at $(date -u +%H:%M:%S) load: $(cut -d' ' -f1-3 /proc/loadavg)"
          [ "$booted" = 1 ]

      - name: Run real input
        run: node scripts/real-input/android.mjs

      - name: Upload real-input evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-input-android-${{ matrix.attempt }}
          include-hidden-files: true
          path: |
            .real-input/android
            example/e2e/.e2e/android
            ${{ runner.temp }}/emulator.log
          if-no-files-found: warn

  # Xcode 27 because `rn-harness.config.mjs` asks for an iOS 27 simulator. Opt-in:
  # `xcode-27` is a preview image that can be withdrawn, and a job stuck queued
  # reads like a hung one.
  harness-ios:
    name: Harness (iOS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    # Sized for a build plus a full suite at hosted-runner load.
    timeout-minutes: 60

    env:
      RCT_USE_PREBUILT_RNCORE: 1
      RCT_USE_RN_DEP: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # No .ruby-version/.tool-versions is committed in example/, so the version
      # must be explicit (the action fails without one). The Gemfile only asks
      # for ruby >= 2.6.10.
      - name: Setup Ruby and gems
        uses: ruby/setup-ruby@6797dcbb9a1889fd411d07e8aba7eded53fb8b48 # v1.264.0
        with:
          ruby-version: '3.3'
          working-directory: example
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # `build-app.mjs` writes the stamp the harness config checks, and refuses a
      # failed pod install rather than building against stale headers.
      - name: Build stamped debug app
        run: node scripts/build-app.mjs --platform ios

      - name: Run Harness tests
        uses: callstackincubator/react-native-harness@3e3e25b8ddfd0018fbc0700e0932448ffe5a95db # v1.6.0
        with:
          runner: ios
          projectRoot: example
          packageManager: bun
          # Absolute: the action checks this path from `projectRoot`, not the checkout root.
          app: ${{ github.workspace }}/example/ios/build/Build/Products/Debug-iphonesimulator/NitroUiExample.app
