name: CI

# Nothing in this workflow writes to the repository, and the jobs that upload
# artifacts upload them to the run, not to a branch. Say so, so a dependency
# compromise in a checked-out script cannot widen its reach with the default
# write token (review S2).
permissions:
  contents: read

# The triggered set is three free GitHub-hosted jobs:
#
#   1. `checks` - every static gate (`bun run check`) on Linux;
#   2. `native-tests` - the host C++/Swift/ASan tests, which `check` skips on
#      Linux with a printed reason because they need clang and swiftc;
#   3. `build-android` - a fresh debug APK of the example, which is what catches
#      codegen/dex/packaging problems on a clean checkout.
#
# Everything that needs a simulator or an emulator stays `workflow_dispatch`
# only: the two Harness jobs below, the Android release build, and the on-device
# jobs in `bench.yml` and `smoke.yml`. Hosted runners make those slow and noisy,
# and the device gates that decide a task run locally (docs/DECISIONS.md D22,
# D25). The steps stay here so a maintainer can still start them on demand.
#
# `.github/actions/setup` is the shared install: Node from `.nvmrc`, bun from
# `package.json`'s `packageManager` (1.4), `node_modules` cached.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel a superseded run on a pull request or a feature branch: nothing there
  # is a result anybody keeps, and 20-minute jobs on stale commits is how a queue
  # forms. Never on `main`. It used to cancel there too, so consecutive merges
  # cancelled each other's CI and a sha could land with no conclusion at all -
  # one of the reasons main's seven-hour red on 31 Oct went unnoticed (F4). Every
  # push to main now runs to a conclusion, and `main` is the branch whose green
  # the release pipeline reads.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every static gate: tsc, eslint (incl. the perf-contract rules), prettier,
  # jest, nitrogen drift, bob build, publint and the committed tarball manifest.
  # `test:native` runs inside it and prints a skip reason on Linux; the
  # `native-tests` job below is what actually runs them.
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The bench-deps tests read bun.lock at an earlier commit, as a merge
          # mint does at a baseline's founding sha, so `check` needs history.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run all checks
        run: bun run check

  # The part of `check` that is macOS-only: the D1 clock base, the perf ring, the
  # event-count handshake, the intrinsic-sizing engine under ASan + UBSan, and
  # the two static native guards. The script compiles the shipping sources with
  # the host toolchain - no packages, no simulator - so this job needs no install
  # step, and it calls the script instead of the bun script so that bun does not
  # have to be installed for a one-minute job.
  native-tests:
    name: Native tests (host, ASan)
    # Pinned rather than `macos-latest`: these tests need clang and swiftc, and
    # a floating label means the toolchain changes under a green run - the same
    # reason the iOS jobs name their Xcode. `macos-26` is the current stable
    # macOS image; check it is registered before the next scheduled run.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run host native tests
        run: bash scripts/native-tests.sh

  # The example app the on-device gates consume, built from a clean checkout on
  # the platform whose toolchain is free here. x86_64 only, matching hosted
  # runners.
  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6's default cache provider is a proprietary GitHub service; basic
          # caching works on public and self-hosted runners alike.
          cache-provider: basic
          cache-read-only: false

      # Through the same entry point a local device gate uses, so the job that
      # every pull request runs also proves the stamped build works on a clean
      # checkout - gradle, then the scan that says every registered component is
      # really in the dex. A raw `assembleDebug` proves the toolchain and nothing
      # about the binary (review S1).
      - name: Build stamped debug app
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'
          # See the release job: a hosted runner's ccache starts empty every run.
          NITRO_UI_CCACHE: '0'
        run: node scripts/build-app.mjs --platform android --arch x86_64

      # The Kotlin half of `check`'s `test:native:android` step, here because this is
      # the job that already paid for the Android toolchain: JDK 17, the licences, and
      # a warm gradle cache from the build above, so the JVM tests are seconds rather
      # than a cold dependency download (X15 item 2 - the same split the macOS
      # `native-tests` job makes for the Swift half).
      #
      # `NITRO_UI_ANDROID_JVM_TESTS=1` is what makes this step run at all: the script
      # skips on `CI`, which Actions sets on *every* step, so without the opt-in the
      # job it hands off to would print the skip and run nothing (X15 review).
      # `scripts/__tests__/native-tests-android-skip.test.js` runs this step's own env
      # against the script and fails if the two ever disagree.
      - name: Android JVM unit tests
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'
          NITRO_UI_ANDROID_JVM_TESTS: '1'
        run: bash scripts/native-tests-android.sh

  # A release build of the example app: this is what catches codegen/dex/R8
  # problems that a debug build tolerates. Slower than the debug build and not
  # something every pull request needs, so it is opt-in.
  build-android-release:
    name: Build Android (release)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6's default cache provider is a proprietary GitHub service; basic
          # caching works on public and self-hosted runners alike.
          cache-provider: basic
          cache-read-only: false

      # No -PreactNativeArchitectures here on purpose: the brief for X6 asks that
      # the release build keep all four ABIs, and this is the one job that would
      # catch an armeabi-v7a/x86 compile break in cpp/ (a library user's app
      # builds all four by default). It costs roughly four times the native
      # compile on a hosted runner, which is why the job is workflow_dispatch
      # only and never runs on a pull request. Before X6 this passed
      # -PreactNativeArchitectures=x86_64: the review asked for that to be a
      # chosen cost rather than an accident, so it is recorded here and in
      # docs/tasks/X6-build-speed.report.md.
      - name: Assemble release APK
        working-directory: example/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'
          # Hosted runners ship ccache with an empty cache, where a launcher is
          # pure overhead. Say "no" rather than depend on the runner image: this
          # is what makes the local-only nature of the cache (X6) explicit.
          NITRO_UI_CCACHE: '0'
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

  # On-device tests (example/__tests__/*.harness.tsx) against a debug build.
  # The harness action boots and caches the AVD named in rn-harness.config.mjs.
  # Opt-in: it needs KVM, and an emulator on a hosted runner is slower and less
  # reproducible than the local gate that decides a task.
  harness-android:
    name: Harness (Android)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: false

      # Through scripts/build-app.mjs rather than gradle directly: that is what
      # writes example/android/app.stamp, and `rn-harness.config.mjs` refuses an
      # APK it cannot prove was built from this tree. A raw `assembleDebug` here
      # builds the same binary and then fails its own gate (review S1).
      - name: Build stamped debug app
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g'
          # See the release job: a hosted runner's ccache starts empty every run.
          NITRO_UI_CCACHE: '0'
        run: node scripts/build-app.mjs --platform android --arch x86_64

      - name: Run Harness tests
        uses: callstackincubator/react-native-harness@3e3e25b8ddfd0018fbc0700e0932448ffe5a95db # v1.6.0
        with:
          runner: android
          projectRoot: example
          packageManager: bun
          # Absolute, and that is not style. The action exports this verbatim as
          # `HARNESS_APP_PATH`, and the Android platform only ever asks
          # `existsSync` on it - from `projectRoot`, which is `example/`, not the
          # checkout root this path would be relative to. A relative one names a
          # file that does not exist, the app is never installed, and the run dies
          # as an opaque `AbortError` (A2 lost three runs to that message).
          app: ${{ github.workspace }}/example/android/app/build/outputs/apk/debug/app-debug.apk

  # Builds a Debug simulator app and runs the Harness tests on it. Xcode 27 is
  # required because rn-harness.config.mjs asks for an iOS 27 simulator. The
  # label is GitHub's preview image rather than a versioned macOS one, and it
  # does schedule: a run on 2026-10-24 got the `xcode-27-arm64` image (so the
  # earlier worry that it might never get a runner was wrong). It stays opt-in
  # because a preview image can still be pulled, and a job stuck queued reads
  # exactly like a hung one.
  #
  # There is no older-iOS row here, and no `macos-26` row that could be one:
  # neither `xcode-27` nor `macos-26` ships a simulator runtime below iOS 26, so
  # the declared sizing fallbacks cannot be exercised on an older runtime by any
  # label this workflow can schedule on. `docs/ci-runner-images.md` records what
  # each published image manifest installs, which image series has iOS 18 at all
  # (macos-15), and what moving a device job there would take (F4, rows 6/12).
  harness-ios:
    name: Harness (iOS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27

    env:
      RCT_USE_PREBUILT_RNCORE: 1
      RCT_USE_RN_DEP: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # No .ruby-version/.tool-versions is committed in example/, so the version
      # must be explicit (the action fails without one). The Gemfile only asks
      # for ruby >= 2.6.10.
      - name: Setup Ruby and gems
        uses: ruby/setup-ruby@6797dcbb9a1889fd411d07e8aba7eded53fb8b48 # v1.264.0
        with:
          ruby-version: '3.3'
          working-directory: example
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # The same build the local gate uses: pod install, xcodebuild into
      # example/ios/build, and the stamp the harness config then checks (S1).
      # build-app.mjs reuses the Pods cache above and refuses a red pod install
      # rather than continuing with stale headers.
      - name: Build stamped debug app
        run: node scripts/build-app.mjs --platform ios

      - name: Run Harness tests
        uses: callstackincubator/react-native-harness@3e3e25b8ddfd0018fbc0700e0932448ffe5a95db # v1.6.0
        with:
          runner: ios
          projectRoot: example
          packageManager: bun
          # Absolute for the same reason as the Android job's: see there.
          app: ${{ github.workspace }}/example/ios/build/Build/Products/Debug-iphonesimulator/NitroUiExample.app
