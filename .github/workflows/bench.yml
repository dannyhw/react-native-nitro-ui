name: Bench

# Perf is **report-only** here: hosted runners are noisy, so a red check would
# teach people to ignore it. The hard gates stay static (lint, nitrogen drift,
# API report, tarball manifest, Jest, Reassure render counts - the last one runs
# inside `bun run check`). This workflow posts head/base ratios on request and
# files a nightly trend record.
#
# Ask for it on a PR with the `bench` label or a `/bench` comment from someone
# who can write to the repository.
#
# NOTE: not yet exercised in CI - T02 wrote it from the same commands that
# produced docs/tasks/T02-bench.report.md. Expect to tune on the first run;
# everything it calls is the normal local entry point (`bun bench`,
# `bun run bench:report`).
#
# Baselines: committed baselines are ratio-only and D9 wants them produced in one
# canonical environment. This job is that environment, and it is the device pair
# D9 names: `ios27-sim-iphone17` and `android35-emu-pixel9`. A machine on someone's
# desk is a different device key, so it compares (`--compare`) rather than checks.

# Manual only, like the other device jobs (docs/DECISIONS.md D22, D25): the
# scheduled and label/comment triggers are off, so nothing runs here until a
# maintainer starts it. The `trigger` job below still understands those events,
# so re-enabling them is a change to this block alone. A dispatch run has base ==
# head, which is a noise sample and not a comparison.
on:
  workflow_dispatch:

# `pull-requests: write` is needed by exactly two things: posting the comment and
# `gh pr checkout`. Nothing else in here may write.
permissions:
  contents: read
  pull-requests: write

jobs:
  trigger:
    name: Should benchmarks run?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      pr: ${{ steps.decide.outputs.pr }}
    steps:
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          BODY: ${{ github.event.comment.body }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_FROM_LABEL: ${{ github.event.pull_request.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          run=false
          pr=''

          # This workflow builds and runs code from the pull request on a machine
          # with an emulator and an Xcode, using a `pull-requests: write` token.
          # So who may start it matters: labelling already requires write access,
          # and a comment must come from someone who has it too (T02 review S14).
          is_member() {
            case "$1" in
              OWNER|MEMBER|COLLABORATOR) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Anchored: an unanchored `/bench` also matches a comment that merely
          # mentions `scripts/bench/run.mjs`.
          if [ "$EVENT" = "pull_request" ] && [ "$LABEL" = "bench" ]; then
            run=true
            pr="$PR_FROM_LABEL"
          elif [ "$EVENT" = "issue_comment" ] && [ -n "$IS_PR_COMMENT" ] \
            && is_member "$AUTHOR_ASSOCIATION" \
            && printf '%s\n' "$BODY" | grep -qE '^/bench([[:space:]]|$)'; then
            run=true
            pr="$ISSUE_NUMBER"
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ]; then
            run=true
          fi

          {
            echo "run=$run"
            if [ -n "$pr" ]; then
              echo "pr=$pr"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "run=$run pr=${pr:-<none>}"

  bench-ios:
    name: Bench iOS
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    concurrency:
      # On the job, not the workflow: a workflow-level group cancelled the
      # in-flight bench from the *trigger* job's early exit or from a comment
      # that the trigger would have filtered out anyway, and it cancelled the
      # sibling platform job of the same run. The job name keeps iOS and
      # Android from cancelling each other (T02 round-4 review).
      group: >-
        bench-${{ github.workflow }}-${{
          github.event.pull_request.number || github.event.issue.number || github.ref }}-ios
      cancel-in-progress: true
    # D2: the Xcode 27 label, not a macOS image name. Xcode 16 cannot build
    # against the SDK Expo SDK 58 / RN 0.88 need.
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The head/base comparison needs history.
          fetch-depth: 0
          # The job has a `pull-requests: write` token and then runs `bun
          # install` and xcodebuild from pull-request code. Persisting that
          # token into `.git/config` hands PR code a write-PR credential;
          # `gh pr checkout` and `gh pr comment` authenticate with `GH_TOKEN`
          # from their step environment instead (T02 round-4 review).
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check out the pull request head
        # An `issue_comment` event checks out the *default* branch, so without
        # this `/bench` would have compared main against main (T02 review S14).
        if: needs.trigger.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.trigger.outputs.pr }}
        run: |
          gh pr checkout "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          git rev-parse HEAD

      - name: Create and boot the simulator
        # Named exactly `iPhone 17` on purpose: the results device key is derived
        # from the simulator name plus its runtime (D9), so this run is attributed
        # to `ios27-sim-iphone17`.
        run: |
          UDID=$(xcrun simctl create "iPhone 17" "iPhone 17")
          echo "IOS_SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"

      - name: Resolve revisions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "HEAD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          BASE=$(git merge-base HEAD "origin/${BASE_REF:-main}")
          echo "BASE_SHA=$(git rev-parse --short "$BASE")" >> "$GITHUB_ENV"

      # base first, head second, so the numbers under review are measured last on
      # an identically configured runner. `bench/ios` and `bench/results` are
      # gitignored, so checking out another revision disturbs neither - but a
      # native-config change in head would be silently reused from base, hence
      # `--prebuild` on both runs.
      - name: Build and run base
        continue-on-error: true
        run: |
          git checkout -f "$BASE_SHA"
          bun install
          bun bench --platform ios --plan quick --prebuild

      - name: Build and run head
        continue-on-error: true
        run: |
          git checkout -f "$HEAD_SHA"
          bun install
          bun bench --platform ios --plan quick --prebuild

      - name: Report
        run: |
          # shellcheck disable=SC2010  # fixed artifact names, nothing exotic
          HEAD_FILE=$(ls -1 bench/results/ 2>/dev/null \
            | grep -E "^${HEAD_SHA}(-dirty)?-ios-" | tail -1 || true)
          if [ -z "$HEAD_FILE" ]; then
            echo 'No results were written - the runs failed.' > bench-ios.md
            exit 0
          fi
          # A nightly/dispatch run has base == head, which is a noise sample and
          # not a comparison, so it gets no ratio table.
          if [ "$BASE_SHA" != "$HEAD_SHA" ]; then
            node scripts/bench/report.mjs "bench/results/$HEAD_FILE" \
              --compare "$BASE_SHA" > bench-ios.md || true
          else
            node scripts/bench/report.mjs "bench/results/$HEAD_FILE" > bench-ios.md
          fi

      - name: Summarise
        env:
          PR_NUMBER: ${{ needs.trigger.outputs.pr }}
        run: |
          # shellcheck disable=SC2016  # literal markdown, backticks included
          {
            echo "## iOS benchmarks ($HEAD_SHA)"
            if [ -z "$PR_NUMBER" ]; then
              echo
              echo '_Nightly noise sample on the default branch - no base comparison, and_'
              echo '_the same revision twice is expected here. Read it as a noise floor._'
            fi
            echo
            cat bench-ios.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: needs.trigger.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.trigger.outputs.pr }}
        run: |
          # shellcheck disable=SC2016  # literal markdown, backticks included
          {
            echo "### iOS benchmarks ($HEAD_SHA vs base $BASE_SHA)"
            echo
            echo 'Report-only. Read the launch-paired ratios to `rn-core`.'
            echo
            cat bench-ios.md
          } > comment-ios.md
          gh pr comment "$PR_NUMBER" --body-file comment-ios.md

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-ios-${{ github.run_id }}
          path: bench/results/
          if-no-files-found: ignore

      - name: Shut the simulator down
        if: always()
        # Last, not right after boot. The bench runs deliberately leave the
        # simulator up (`--shutdown` is not passed: the head run must reuse the
        # warm simulator the base run booted); this is the safety net for a
        # failed step in between. Only what this job created.
        run: xcrun simctl shutdown "$IOS_SIM_UDID" || true

  bench-android:
    name: Bench Android
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    concurrency:
      # See the iOS job: keyed per platform so the two never cancel each other.
      group: >-
        bench-${{ github.workflow }}-${{
          github.event.pull_request.number || github.event.issue.number || github.ref }}-android
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # The AVD the emulator runner creates, and the name `devices.mjs` derives
      # the device key from. With `-profile: pixel_9` on API 35 that key is
      # `android35-emu-pixel9`, D9's canonical Android device.
      ANDROID_AVD: nitroui-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # See the iOS job: no PR token survives into `.git/config`.
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check out the pull request head
        if: needs.trigger.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.trigger.outputs.pr }}
        run: |
          gh pr checkout "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          git rev-parse HEAD

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      # The hosted ubuntu runners ship /dev/kvm owned by root, so an emulator
      # either refuses to start or crawls in translation mode without this udev
      # rule from the emulator-runner README (T02 round-4 review).
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Accept Android SDK licenses
        run: /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Resolve revisions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "HEAD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          BASE=$(git merge-base HEAD "origin/${BASE_REF:-main}")
          echo "BASE_SHA=$(git rev-parse --short "$BASE")" >> "$GITHUB_ENV"

      # This used to hand-roll `avdmanager create avd` plus a background
      # `emulator`, which never installed the emulator or system-image packages
      # and never touched KVM - so the job could not have booted anything
      # (T02 review S14). The runner installs the packages, creates the AVD from
      # the requested profile, waits for boot, and disables animations.
      - name: Bench base, then head
        uses: ReactiveCircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_9
          avd-name: nitroui-ci
          force-avd-creation: true
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot-save
            -gpu swiftshader_indirect
          script: |
            git checkout -f "$BASE_SHA"
            bun install
            bun bench --platform android --plan quick --prebuild || true
            git checkout -f "$HEAD_SHA"
            bun install
            bun bench --platform android --plan quick --prebuild || true

      - name: Report
        run: |
          # shellcheck disable=SC2010  # fixed artifact names, nothing exotic
          HEAD_FILE=$(ls -1 bench/results/ 2>/dev/null \
            | grep -E "^${HEAD_SHA}(-dirty)?-android-" | tail -1 || true)
          if [ -z "$HEAD_FILE" ]; then
            echo 'No results were written - the runs failed.' > bench-android.md
            exit 0
          fi
          if [ "$BASE_SHA" != "$HEAD_SHA" ]; then
            node scripts/bench/report.mjs "bench/results/$HEAD_FILE" \
              --compare "$BASE_SHA" > bench-android.md || true
          else
            node scripts/bench/report.mjs "bench/results/$HEAD_FILE" > bench-android.md
          fi

      - name: Summarise
        env:
          PR_NUMBER: ${{ needs.trigger.outputs.pr }}
        run: |
          {
            echo "## Android benchmarks ($HEAD_SHA)"
            if [ -z "$PR_NUMBER" ]; then
              echo
              echo '_Nightly noise sample on the default branch - no base comparison._'
            fi
            echo
            echo 'Software-rendered emulator: absolute times are not comparable'
            echo 'to a device, only the ratios mean anything.'
            echo
            cat bench-android.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: needs.trigger.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.trigger.outputs.pr }}
        run: |
          # shellcheck disable=SC2016  # literal markdown, backticks included
          {
            echo "### Android benchmarks ($HEAD_SHA vs base $BASE_SHA)"
            echo
            echo 'Report-only. Read the launch-paired ratios to `rn-core`.'
            echo
            cat bench-android.md
          } > comment-android.md
          gh pr comment "$PR_NUMBER" --body-file comment-android.md

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-android-${{ github.run_id }}
          path: bench/results/
          if-no-files-found: ignore
