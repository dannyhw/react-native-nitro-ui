name: Release tag

# Creates `v<version>` and its GitHub release once `package.json`'s version is
# live on npm. Every path is a no-op when the tag exists, so re-runs are safe.

on:
  schedule:
    # Off the hour: minute 0 is when hourly crons everywhere fire, and a
    # scheduled run that cannot get a runner can be skipped outright.
    - cron: '17 * * * *'
  # Run it by hand right after approving a staged version.
  workflow_dispatch:

# One at a time, and never cancel a run that is already creating a release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  catch-up:
    name: Tag and release a live version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script walks the history of `package.json` to find the commit
          # that set the current version.
          fetch-depth: 0
          # `gh` talks to the API with GH_TOKEN; no git credential is needed.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Catch up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-catch-up.mjs
