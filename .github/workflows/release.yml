name: Release

# Releases are cut by Changesets (DECISIONS D27) and *staged* on npm (D28).
#
# Nothing in this workflow can put a version on the registry. The package's npm
# Trusted Publisher allows staged publishing only, so the last step is a person:
#
#   a changeset -> the Version Packages pull request -> merge -> this workflow
#   stages the new tarball -> the owner approves it on npmjs.com -> `Release
#   tag` creates `vX.Y.Z` and the GitHub release once the version is live.
#
# There is no npm token anywhere. `stage` trades the job's OIDC token for
# staging rights, and that is the only thing it can do with them.
#
# Why a tarball travels between jobs instead of one job doing everything:
# packing runs this package's `prepare` (builder-bob -> nitrogen), which pulls in
# the repo's whole dependency tree. That must not happen while a process holds
# credentials that can reach npm. So the checks and the packing happen in `pack`
# behind read-only rights, and `stage` — which holds the OIDC token — checks out
# nothing, installs nothing and runs no repository script: it verifies a
# checksum, looks at the registry and stages.

on:
  push:
    branches:
      - main
  # Re-running by hand is how a dropped or failed run is recovered.
  workflow_dispatch:

# Never cancel a run that is already going: it may be mid-way through staging.
# Note what `cancel-in-progress: false` does *not* do: GitHub keeps one pending
# run per group, so a burst of merges can still drop a queued run in favour of
# the newest one. That is safe here because no job keys on "my run published" —
# `package.json` and the registry are the state, so the next run stages whatever
# a dropped run did not, and re-running a dropped run works from its commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# No job inherits rights; each one declares what it needs.
permissions: {}

jobs:
  pack:
    name: Check and pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Everything that runs repository code lives in a job with read rights only.
    permissions:
      contents: read
    outputs:
      package: ${{ steps.pack.outputs.package }}
      version: ${{ steps.pack.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      # `.nvmrc`, handed to the staging job, which has no checkout to read it from.
      node: ${{ steps.node.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Publish the Node version
        id: node
        run: printf 'version=%s\n' "$(sed 's/^v//' .nvmrc)" >> "$GITHUB_OUTPUT"

      # Stage exactly what CI validates: typecheck, lint, tests, nitrogen drift,
      # the bob build, publint and the tarball manifest.
      - name: Run all checks
        run: bun run check

      - name: Verify committed codegen
        run: git diff --exit-code -- nitrogen/

      # The tarball is packed from this tree, so nothing the gates leave behind
      # may be sitting there when it happens.
      - name: Verify a clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error title=Unclean tree::bun run check modified tracked files; they would end up in the tarball."
            exit 1
          fi

      # `npm pack` runs `prepare`, so the artifact is byte-for-byte what would be
      # published, and the manifest gate above already covers its contents.
      - name: Pack
        id: pack
        env:
          TARBALL_DIR: ${{ runner.temp }}/package
        run: |
          set -euo pipefail
          mkdir -p "$TARBALL_DIR"
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          TARBALL="$(npm pack --pack-destination "$TARBALL_DIR" | tail -n 1)"
          if [ ! -f "$TARBALL_DIR/$TARBALL" ]; then
            echo "::error title=Packing failed::npm pack did not write $TARBALL"
            exit 1
          fi
          SHA256="$(sha256sum "$TARBALL_DIR/$TARBALL" | cut -d ' ' -f1)"
          {
            echo "package=$NAME"
            echo "version=$VERSION"
            echo "tarball=$TARBALL"
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Packed **$NAME@$VERSION** as $TARBALL"
            echo "- sha256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-tarball
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 30

  stage:
    name: Stage on npm
    needs: pack
    # A manual dispatch from another branch must never stage a version.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job with OIDC rights, and staging a tarball is all it can spend
    # them on. Deliberately: no checkout, no bun, no install, no repository
    # script, so nothing from the tree runs while a publish-capable token is in
    # the environment.
    permissions:
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Handed over by the pack job: there is no checkout here to read
          # `.nvmrc` from, and trusted publishing needs npm >= 11.5.1 on a
          # supported Node.
          node-version: ${{ needs.pack.outputs.node }}
          registry-url: 'https://registry.npmjs.org'
          # npm's own docs: never use a package cache in a release build.
          package-manager-cache: false

      # Pinned so a new npm major cannot quietly change what we ask the registry
      # for. Bump it deliberately, with `npm view` and `npm stage publish` re-read.
      - name: Pin npm
        run: |
          npm install --global npm@11.19.1
          npm --version

      - name: Download the tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-package-tarball
          path: ${{ runner.temp }}/package

      - name: Verify the checksum
        env:
          SHA256: ${{ needs.pack.outputs.sha256 }}
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: |
          printf '%s  %s\n' "$SHA256" "$TARBALL" \
            | (cd "$RUNNER_TEMP/package" && sha256sum --check --status)
          echo "Verified the tarball's sha256." >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the tarball
        env:
          PACKAGE: ${{ needs.pack.outputs.package }}
          VERSION: ${{ needs.pack.outputs.version }}
          TARBALL: ${{ needs.pack.outputs.tarball }}
          TARBALL_DIR: ${{ runner.temp }}/package
        run: |
          set -euo pipefail
          say() {
            printf '%s\n' "$1"
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          # State, not memory: a version that is live needs nothing from us.
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            say "**$PACKAGE@$VERSION** is already on the registry — nothing to stage."
            exit 0
          fi

          # Best effort only. Shortlived trust tokens may not run `npm stage
          # list`, so this reads anonymously and comes back empty; what makes a
          # re-run safe is npm's own "cannot publish over the previously
          # published versions" rejection, handled below.
          STAGED="$(npm stage list --json "$PACKAGE" 2>/dev/null || true)"
          if printf '%s' "$STAGED" | grep -qF "\"version\": \"$VERSION\""; then
            say "**$PACKAGE@$VERSION** is already staged, waiting to be approved."
            exit 0
          fi

          say "### Staging $PACKAGE@$VERSION"
          set +e
          OUTPUT="$(npm stage publish "$TARBALL_DIR/$TARBALL" \
            --access public --tag latest --provenance --loglevel verbose 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            say "Staged. Nothing is live until the owner approves it on npmjs.com (Staged Packages, or npm stage approve <id>), and **Release tag** then creates v$VERSION once the version appears on the registry."
            exit 0
          fi

          # Re-running this run, or a run that raced with one already approved:
          # npm already knows this version, which is the outcome we wanted.
          if printf '%s' "$OUTPUT" | grep -qiF 'cannot publish over the previously published versions'; then
            say "**$PACKAGE@$VERSION** is already known to the registry — staged or published, nothing more to do."
            exit 0
          fi

          echo "::error title=Staging failed::npm stage publish exited $STATUS for $PACKAGE@$VERSION"
          say "Staging failed (exit $STATUS). Fix the cause and re-run this workflow, or stage by hand from the artifact."
          exit "$STATUS"

  version:
    name: Version Packages pull request
    needs: pack
    # macOS, not ubuntu, because of one line in `release:version`: after
    # `changeset version` bumps package.json, `sync-example-lock.mjs --fix` runs
    # `pod install` so the Version Packages commit carries a lock that matches the
    # version it just wrote. That has to be real CocoaPods: the lock's
    # `SPEC CHECKSUMS` entry for a pod pulled `from:` a path is the sha1 of
    # CocoaPods' own stored evaluation of the podspec, which nothing else in this
    # repo can reproduce. The alternative — checking the lock in on Linux — is what
    # let `NitroUi (0.2.0)` survive the whole 0.3.x line, and every iOS build since
    # dirtied the tree and invalidated its own `app.stamp`. `bun run check` guards
    # the version on every platform, so a refresh that fails here cannot go
    # unnoticed; it just cannot be *fixed* on Linux.
    runs-on: macos-26
    timeout-minutes: 30
    # Enough to commit a version bump and open a pull request. No OIDC rights:
    # this job runs the repository's own scripts, so it must not be able to
    # reach npm either.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets compares the tree with `main` and with the existing tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # The pinned ruby (the same one the iOS harness job uses) and then the exact
      # CocoaPods the lock's own trailer records. Two pins rather than `bundle install`
      # of `example/Gemfile`, because that Gemfile only asks for `>= 1.13`: whichever
      # version resolves would write checksums nobody compared, and the version the
      # *lock* names is the one that keeps the file byte-comparable with the ones the
      # maintainer machines write. `setup-ruby` puts its gem dir on PATH and owns it,
      # so this needs no sudo. `pod-install.mjs` then finds it as `pod _<pin>_`.
      - name: Setup Ruby
        uses: ruby/setup-ruby@6797dcbb9a1889fd411d07e8aba7eded53fb8b48 # v1.264.0
        with:
          ruby-version: '3.3'

      # `json` is a default gem, so `setup-ruby` hands it to CocoaPods at whatever
      # version that Ruby shipped - 2.7.2 for Ruby 3.3 - and that version decides
      # how `JSON.pretty_generate` renders an empty collection. CocoaPods hashes
      # exactly those bytes for every pod pulled `from:` a path, so this one
      # transitive dependency is the difference between a release and 87 changed
      # `SPEC CHECKSUMS` lines: run 40789293108, where the runner serialised
      # `"React-cxxstableapi": [\n\n]` and the maintainer Macs write
      # `"React-cxxstableapi": []`. Install it *before* cocoapods so the gem set
      # resolves with it in place. See scripts/pod-install-lib.mjs.
      #
      # Deliberately a json pin rather than a Ruby pin: `cocoapods-core` only
      # requires `ruby >= 2.6`, so json is the variable and pinning it lets
      # `ruby-version` above keep tracking the iOS harness job.
      - name: Pin the json gem CocoaPods serialises podspecs with
        run: |
          set -euo pipefail
          gem install json -v 2.18.0 --no-document
          # Assert what *loads*, not what is installed. `gem list json` shows
          # every version on the gem path side by side - `json (2.18.0, default:
          # 2.7.2)` - and says nothing about which one `require "json"` picks,
          # which is the only fact this pin is about. `ruby -rjson` takes the
          # same default-gem activation path CocoaPods takes, so either this
          # line says the pin took effect, or the job says so here rather than
          # twenty minutes later at the preflight probe.
          ruby -rjson -e '
            ok = Gem::Version.new(JSON::VERSION) >= Gem::Version.new("2.8.0")
            puts "pod-serialisation: `require \"json\"` loads #{JSON::VERSION} " \
              "(needs >= 2.8.0, the first version whose JSON.pretty_generate " \
              "writes `[]` for an empty array)"
            exit(ok ? 0 : 1)
          ' || {
            echo "::error title=The json pin did not take::The Ruby this job loads is still serialising empty arrays the pre-2.8 way; a pod install here would rewrite nearly every SPEC CHECKSUMS line."
            exit 1
          }

      - name: Install the pinned CocoaPods
        run: |
          set -euo pipefail
          PIN="$(sed -n 's/^COCOAPODS: //p' example/ios/Podfile.lock | tr -d '[:space:]')"
          if [ -z "$PIN" ]; then
            echo "::error title=No CocoaPods pin::example/ios/Podfile.lock has no COCOAPODS: trailer"
            exit 1
          fi
          gem install cocoapods -v "$PIN" --no-document
          pod --version

      # No separate "does this runner serialise podspecs like the lock" step:
      # `release:version` begins with `sync-example-lock.mjs --preflight`, which
      # asks `pod ipc spec` exactly that and refuses before `changeset version`
      # runs, so the answer is already in the log above the churn guard's own
      # report. One question, one place that asks it.

      # `publish-script` is unset on purpose: with none, the action only ever
      # versions and opens or updates the pull request, and never publishes —
      # which is what the stage job above is for.
      - name: Version the changesets
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # `changeset version` and then the lock refresh, in one working tree. The
          # action commits everything in that tree straight after this script, so the
          # lock has to be repaired *here* for the PR's commit to be internally
          # consistent — which is also what keeps the guard in `check` green on the
          # commit the Version Packages PR opens with.
          version-script: bun run release:version
          # Changesets would tag a release `react-native-nitro-ui@0.1.1`, not
          # `v0.1.1`: it only writes a plain `vX.Y.Z` for a package whose
          # workspace tool is `root`, and `"."` in `workspaces` makes manypkg
          # report `bun`. `Release tag` makes the tags and the release instead,
          # once the version is actually live. Both stay off as a guard, even
          # though the action only reads them in publish mode.
          push-git-tags: 'false'
          create-github-releases: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `release:version` is supposed to have done the work; this says so in the run
      # rather than leaving it to the next person's `git blame`. It cannot be the
      # guard: the action commits and pushes before this step, so by the time it can
      # fail the damage is on the branch.
      - name: Confirm the lock followed the version
        if: steps.changesets.outputs.has-changesets == 'true'
        run: bun run lock:check

      - name: Report
        if: always()
        env:
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
          HAS_CHANGESETS: ${{ steps.changesets.outputs.has-changesets }}
        run: |
          {
            if [ "${HAS_CHANGESETS:-false}" = "true" ]; then
              echo "Changesets found. Version Packages pull request: ${PR_NUMBER:-not opened}."
            else
              echo "No pending changesets, so there is nothing to version. The version already on main is handled by **Stage on npm**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
