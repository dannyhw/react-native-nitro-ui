name: Release

# Releases are cut by Changesets (DECISIONS D27). Merging a pull request into
# `main` opens or updates the "Version Packages" pull request; merging *that*
# publishes `react-native-nitro-ui` and tags `vX.Y.Z` with a GitHub release
# built from the changelog entry.
#
# Publishing uses npm trusted publishing — there is no npm token anywhere:
#   1. the package's Trusted Publisher on npmjs.com names this repo and this
#      workflow file (set up once by the owner);
#   2. `id-token: write` gives the job an OIDC token, and npm >= 11.5.1
#      exchanges it for publish rights.
# Provenance is attached from the same token (see NPM_CONFIG_PROVENANCE below).

on:
  push:
    branches:
      - main

# One release at a time, and never cancel one: a queued run must publish from
# the main it was queued for, not be replaced mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # version commit, vX.Y.Z tag, GitHub release
  pull-requests: write # the Version Packages pull request
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets compares the tree with the base branch and with existing
          # tags, so it needs the full history. The version commit and the tag
          # go through the GitHub API, so no git credentials stay on disk.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing needs npm >= 11.5.1. Pinned so a new npm major
      # cannot quietly change what `changeset publish` asks the registry for;
      # bump it deliberately.
      - name: Update npm
        run: |
          npm install --global npm@11.19.1
          npm --version

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Publish exactly what CI validates: typecheck, lint, tests, nitrogen
      # drift, the bob build, publint and the tarball manifest.
      - name: Run all checks
        run: bun run check

      - name: Verify committed codegen
        run: git diff --exit-code -- nitrogen/

      # `changesets/action` commits whatever the working tree holds, so nothing
      # the gates leave behind may ride into the Version Packages pull request.
      - name: Verify a clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error title=Unclean tree::bun run check modified tracked files; the release commit would include them."
            exit 1
          fi

      # Version mode: run `release:version` (changeset version + lockfile
      # refresh) and open/update the pull request. Publish mode: run
      # `release:publish`, which is `changeset publish` -> `npm publish` for the
      # version already committed on main. The publish needs no extra build
      # step: npm runs this package's `prepare` (bob -> nitrogen, both pure
      # Node) before packing, which is what `bun run check` just verified.
      - name: Version or publish
        id: release
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run release:version
          publish-script: bun run release:publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # `changeset publish` calls `npm publish` with its own flags only, so
          # provenance goes in through npm's config environment. It is made
          # from the job's OIDC token, the same one trusted publishing uses.
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Report
        run: |
          {
            echo "version pull request: ${PR_NUMBER:-none}"
            echo "published: ${PUBLISHED:-false}"
            echo "published packages: ${PUBLISHED_PACKAGES:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PR_NUMBER: ${{ steps.release.outputs.pr-number }}
          PUBLISHED: ${{ steps.release.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.release.outputs.published-packages }}
