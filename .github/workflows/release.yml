name: Release

# Versions the package with Changesets and stages the tarball on npm. Staging is
# all this workflow can do: a person approves the staged version on npmjs.com.

on:
  push:
    branches:
      - main
  # Re-running by hand is how a dropped or failed run is recovered.
  workflow_dispatch:

# Never cancel a run in progress: it may be half-way through staging. A queued
# run can still be dropped for a newer one, which is safe because every run
# stages whatever the registry does not have yet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# No job inherits rights; each one declares what it needs.
permissions: {}

jobs:
  pack:
    name: Check and pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Everything that runs repository code lives in a job with read rights only.
    permissions:
      contents: read
    outputs:
      package: ${{ steps.pack.outputs.package }}
      version: ${{ steps.pack.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      # `.nvmrc`, handed to the staging job, which has no checkout to read it from.
      node: ${{ steps.node.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `check` needs the full history.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          # A release build never reuses a package cache: the tarball must come
          # from an install of this tree, and a cache key does not prove that.
          package-manager-cache: false

      - name: Publish the Node version
        id: node
        run: printf 'version=%s\n' "$(sed 's/^v//' .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Run all checks
        run: bun run check

      - name: Verify committed codegen
        run: git diff --exit-code -- nitrogen/

      # The tarball is packed from this tree, so nothing the gates leave behind
      # may be sitting there when it happens.
      - name: Verify a clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error title=Unclean tree::bun run check modified tracked files; they would end up in the tarball."
            exit 1
          fi

      # `npm pack` runs `prepare`, so the artifact is byte-for-byte what gets
      # published.
      - name: Pack
        id: pack
        env:
          TARBALL_DIR: ${{ runner.temp }}/package
        run: |
          set -euo pipefail
          mkdir -p "$TARBALL_DIR"
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          TARBALL="$(npm pack --pack-destination "$TARBALL_DIR" | tail -n 1)"
          if [ ! -f "$TARBALL_DIR/$TARBALL" ]; then
            echo "::error title=Packing failed::npm pack did not write $TARBALL"
            exit 1
          fi
          SHA256="$(sha256sum "$TARBALL_DIR/$TARBALL" | cut -d ' ' -f1)"
          {
            echo "package=$NAME"
            echo "version=$VERSION"
            echo "tarball=$TARBALL"
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Packed **$NAME@$VERSION** as $TARBALL"
            echo "- sha256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-tarball
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 30

  stage:
    name: Stage on npm
    needs: pack
    # A manual dispatch from another branch must never stage a version.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job with OIDC rights. It has no checkout, no install and no
    # repository script, so nothing from the tree runs while a token that can
    # reach npm is in the environment.
    permissions:
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Handed over by the pack job: there is no checkout here to read
          # `.nvmrc` from, and trusted publishing needs npm >= 11.5.1 on a
          # supported Node.
          node-version: ${{ needs.pack.outputs.node }}
          registry-url: 'https://registry.npmjs.org'
          # A release build never uses a package cache.
          package-manager-cache: false

      # Pinned so a new npm major cannot quietly change what we ask the registry
      # for. Bump it deliberately, with `npm view` and `npm stage publish` re-read.
      - name: Pin npm
        run: |
          npm install --global npm@11.19.1
          npm --version

      - name: Download the tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-package-tarball
          path: ${{ runner.temp }}/package

      - name: Verify the checksum
        env:
          SHA256: ${{ needs.pack.outputs.sha256 }}
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: |
          printf '%s  %s\n' "$SHA256" "$TARBALL" \
            | (cd "$RUNNER_TEMP/package" && sha256sum --check --status)
          echo "Verified the tarball's sha256." >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the tarball
        env:
          PACKAGE: ${{ needs.pack.outputs.package }}
          VERSION: ${{ needs.pack.outputs.version }}
          TARBALL: ${{ needs.pack.outputs.tarball }}
          TARBALL_DIR: ${{ runner.temp }}/package
        run: |
          set -euo pipefail
          say() {
            printf '%s\n' "$1"
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          # A version that is already live needs nothing.
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            say "**$PACKAGE@$VERSION** is already on the registry — nothing to stage."
            exit 0
          fi

          # Best effort: a short-lived trust token may not be allowed to run
          # `npm stage list`, and this then comes back empty. What makes a
          # re-run safe is npm's own rejection, handled below.
          STAGED="$(npm stage list --json "$PACKAGE" 2>/dev/null || true)"
          if grep -qF "\"version\": \"$VERSION\"" <<<"$STAGED"; then
            say "**$PACKAGE@$VERSION** is already staged, waiting to be approved."
            exit 0
          fi

          say "### Staging $PACKAGE@$VERSION"
          set +e
          OUTPUT="$(npm stage publish "$TARBALL_DIR/$TARBALL" \
            --access public --tag latest --provenance --loglevel verbose 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            say "Staged. Nothing is live until the owner approves it on npmjs.com (Staged Packages, or npm stage approve <id>), and **Release tag** then creates v$VERSION once the version appears on the registry."
            exit 0
          fi

          # npm already knows this version, which is the wanted outcome. One
          # that is staged but not yet approved is refused with `E409 ... Cannot
          # stage previously published version`; a live one gets the other wording.
          if grep -qiE 'cannot publish over the previously published versions|cannot stage previously published version' <<<"$OUTPUT"; then
            say "**$PACKAGE@$VERSION** is already known to the registry — staged or published, nothing more to do."
            exit 0
          fi

          echo "::error title=Staging failed::npm stage publish exited $STATUS for $PACKAGE@$VERSION"
          say "Staging failed (exit $STATUS). Fix the cause and re-run this workflow, or stage by hand from the artifact."
          exit "$STATUS"

  version:
    name: Version Packages pull request
    needs: pack
    # macOS because `release:version` runs `pod install` to refresh the example's
    # Podfile.lock, and the lock's `SPEC CHECKSUMS` entry for a path pod can only
    # be computed by CocoaPods itself.
    runs-on: macos-26
    timeout-minutes: 30
    # Enough to commit a version bump and open a pull request. No OIDC rights:
    # this job runs the repository's own scripts, so it must not be able to
    # reach npm either.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets compares the tree with `main` and with the existing tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # CocoaPods is installed at the exact version the lock's trailer records,
      # not through `example/Gemfile` (which only asks for `>= 1.13`), so the lock
      # this job writes is byte-comparable with one written on a developer machine.
      - name: Setup Ruby
        uses: ruby/setup-ruby@6797dcbb9a1889fd411d07e8aba7eded53fb8b48 # v1.264.0
        with:
          ruby-version: '3.3'

      # CocoaPods hashes `JSON.pretty_generate` output for every path pod, and the
      # json 2.7.2 that Ruby 3.3 ships renders an empty array differently from
      # newer versions. Installed before CocoaPods so the gem set resolves with it.
      - name: Pin the json gem CocoaPods serialises podspecs with
        run: |
          set -euo pipefail
          gem install json -v 2.18.0 --no-document
          # Assert what `require "json"` loads, not what is installed: `gem list`
          # shows every version on the gem path, not which one gets picked.
          ruby -rjson -e '
            ok = Gem::Version.new(JSON::VERSION) >= Gem::Version.new("2.8.0")
            puts "pod-serialisation: `require \"json\"` loads #{JSON::VERSION} " \
              "(needs >= 2.8.0, the first version whose JSON.pretty_generate " \
              "writes `[]` for an empty array)"
            exit(ok ? 0 : 1)
          ' || {
            echo "::error title=The json pin did not take::The Ruby this job loads is still serialising empty arrays the pre-2.8 way; a pod install here would rewrite nearly every SPEC CHECKSUMS line."
            exit 1
          }

      - name: Install the pinned CocoaPods
        run: |
          set -euo pipefail
          PIN="$(sed -n 's/^COCOAPODS: //p' example/ios/Podfile.lock | tr -d '[:space:]')"
          if [ -z "$PIN" ]; then
            echo "::error title=No CocoaPods pin::example/ios/Podfile.lock has no COCOAPODS: trailer"
            exit 1
          fi
          gem install cocoapods -v "$PIN" --no-document
          pod --version

      # `publish-script` is unset on purpose: without one the action only versions
      # and opens or updates the pull request, and never publishes.
      - name: Version the changesets
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # The action commits the whole tree straight after this script, so the
          # lock refresh has to happen inside it.
          version-script: bun run release:version
          # Changesets would tag `react-native-nitro-ui@0.1.1`, not `v0.1.1`.
          # `Release tag` creates the tag and the release once the version is live.
          push-git-tags: 'false'
          create-github-releases: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Reports the lock's state in the run. It cannot be a guard: the action has
      # already committed and pushed by this point.
      - name: Confirm the lock followed the version
        if: steps.changesets.outputs.has-changesets == 'true'
        run: bun run lock:check

      - name: Report
        if: always()
        env:
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
          HAS_CHANGESETS: ${{ steps.changesets.outputs.has-changesets }}
        run: |
          {
            if [ "${HAS_CHANGESETS:-false}" = "true" ]; then
              echo "Changesets found. Version Packages pull request: ${PR_NUMBER:-not opened}."
            else
              echo "No pending changesets, so there is nothing to version. The version already on main is handled by **Stage on npm**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
