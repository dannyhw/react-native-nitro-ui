name: Setup
description: Setup bun and install dependencies

inputs:
  package-manager-cache:
    description: >-
      Restore node_modules from, and save it to, the actions cache. A job that
      builds an artifact it intends to publish must set this to false: npm's own
      guidance for release builds is never to reuse a package cache, because the
      install a cache hands back was written by some other tree and `npm pack`
      runs this package's `prepare` through it.
    required: false
    type: boolean
    default: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc

    - name: Setup bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - name: Restore dependencies
      id: bun-cache
      # Gated rather than unconditional so a release job can ask for a clean
      # install without reimplementing this file. `steps.bun-cache.outputs` is
      # empty when this is skipped, which is exactly the cache-miss answer the
      # two steps below want.
      if: inputs.package-manager-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        # bun.lock records a patchedDependencies *path*, not its contents, so
        # the patch files must be part of the key as well.
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('package.json', 'example/package.json', 'patches/**') }}

    - name: Install dependencies
      if: steps.bun-cache.outputs.cache-hit != 'true'
      run: bun install --frozen-lockfile --ignore-scripts
      shell: bash

    - name: Cache dependencies
      if: inputs.package-manager-cache && steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}
