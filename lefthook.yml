# Hooks are opt-in (`bun run hooks:install`): they live in the shared `.git` directory,
# so installing them from one worktree changes them for every worktree.
# `bunx --no-install` fails instead of downloading a look-alike package from npm.
pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: bunx --no-install oxlint {staged_files}

    format:
      run: bunx --no-install oxfmt --check --no-error-on-unmatched-pattern {staged_files}

    types:
      glob: '*.{js,ts,jsx,tsx}'
      run: bun run typecheck
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: bunx --no-install commitlint --edit {1}
